# The iPad app shell. Generated with XcodeGen (`xcodegen generate` in this
# directory) so the project is reviewable text rather than a merge-hostile
# .pbxproj; the generated project is not committed.
name: Setlist
options:
  bundleIdPrefix: com.missingbulb
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  Setlist:
    path: ..
targets:
  Setlist:
    type: application
    platform: iOS
    sources:
      - path: Setlist
    dependencies:
      - package: Setlist
        product: SetlistCore
      - package: Setlist
        product: SetlistUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missingbulb.setlist
        # iPad only: the stage screen is specified at iPad proportions and a
        # phone-sized set list is unreadable from behind a mic.
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # The plist is committed, not synthesised: requirement 6.4 reads it, and
        # the microphone/background declarations are review-visible promises.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Setlist/Info.plist
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  SetlistRequirements:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../dev/requirements
        excludes:
          - "gate"
          - "requirements.md"
          - "README.md"
    dependencies:
      - package: Setlist
        product: SetlistCore
      - package: Setlist
        product: SetlistUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  Setlist:
    build:
      targets:
        Setlist: all
        SetlistRequirements: [test]
    test:
      targets:
        - SetlistRequirements
