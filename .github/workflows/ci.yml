name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  claudinite-sweeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conformance sweep (world scope)
        run: node .claudinite/shared/engine/checks/check_the_world.mjs
      - name: Conformance sweep (work scope)
        run: node .claudinite/shared/engine/checks/ci-work-scope.mjs --branch "${{ github.head_ref || github.ref_name }}"

  requirements-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every requirement leaf is claimed exactly once
        run: node dev/requirements/gate/coverage-gate.mjs

  requirements:
    name: Executable requirements
    runs-on: ubuntu-latest
    # The requirement cases run against SetlistCore, which is platform-
    # independent; the app shell and any simulator-rendered kind build in the
    # `app` job below.
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: swift test

  app:
    name: iPad app and screen requirements
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: app
        run: xcodegen generate
      - name: Pick an iPad simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in sorted(d) if "iOS" in runtime for x in d[runtime] if "iPad" in x["name"]))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -A0 "$udid"
      - name: Build the app and run every requirement kind
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild test \
            -project Setlist.xcodeproj \
            -scheme Setlist \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log
      - name: Report what failed
        if: failure()
        run: tail -120 app/xcodebuild.log
      - name: Keep the renders that did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screen-failures
          path: dev/requirements/screen/.failures/
          if-no-files-found: ignore
