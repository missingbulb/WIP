name: Refresh goldens
# The one entry point that re-renders every screen golden. Running it is how an
# intended UI change lands: the refreshed PNGs ride the branch's diff for the
# owner to approve. It is never how a red case gets fixed — a render that
# changed unintentionally is a bug in the change, not in the golden.
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: write
jobs:
  refresh:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: brew install xcodegen
      - working-directory: app
        run: xcodegen generate
      - name: Pick an iPad simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in sorted(d) if "iOS" in runtime for x in d[runtime] if "iPad" in x["name"]))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Re-render every screen golden
        working-directory: app
        env:
          REFRESH_GOLDENS: "1"
        run: |
          set -o pipefail
          xcodebuild test \
            -project Setlist.xcodeproj \
            -scheme Setlist \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            TEST_RUNNER_REFRESH_GOLDENS=1 > xcodebuild.log || { tail -120 xcodebuild.log; exit 1; }
      - name: Regenerate the gallery and commit
        run: |
          node dev/requirements/gate/coverage-gate.mjs --write || true
          if git diff --quiet; then
            echo "No golden changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/requirements
          git commit -m "Refresh screen goldens, re-rendered by the refresh-goldens workflow"
          git push origin HEAD:${{ github.ref_name }}
